[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suni-live-translator"
version = "0.1.0"
description = "Offline-first Windows audio translation desktop"
requires-python = ">=3.10,<3.13"
dependencies = ["PySide6>=6.8", "numpy>=1.26", "scipy>=1.12", "PyAudioWPatch>=0.2.12.7", "faster-whisper>=1.1,<2", "transformers==4.50.3", "sentencepiece", "torch>=2.6", "piper-tts>=1.3", "pycaw", "psutil", "huggingface-hub<1"]

[project.optional-dependencies]
dev = ["pytest", "pyinstaller"]

[project.scripts]
suni = "apps.desktop.main:main"

[tool.setuptools.packages.find]
include = ["apps*", "engine*", "storage*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
